---
- name: Run database
  community.docker.docker_container:
    name: "{{ db_container }}"
    image: "{{ dockerhub_user }}/{{ db_image }}:latest"
    pull: true
    restart_policy: always
    networks:
      - name: app-network
    env:
      POSTGRES_DB: "{{ db_name }}"
      POSTGRES_USER: "{{ db_user }}"
      POSTGRES_PASSWORD: "{{ db_password }}"
    volumes:
      - db-data:/var/lib/postgresql/data